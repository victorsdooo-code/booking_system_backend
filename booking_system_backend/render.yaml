services:
  - type: web
    name: booking-system-backend
    env: node
    buildCommand: npm install
    startCommand: node server.js
    region: oregon
    plan: free
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        sync: false
        # REQUIRED: Set your MongoDB connection string in Render dashboard
        # Example: mongodb+srv://user:pass@cluster.mongodb.net/qingyiu_clinic
      - key: ADMIN_PASSWORD
        value: admin123
        # NOTE: Change this in production! Set in Render dashboard for security
